name: Validate

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: tests (HA ${{ matrix.homeassistant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2024.7.4"
            python: "3.12"
            compat_packages: "josepy<2"
          - homeassistant: "2025.6.3"
            python: "3.13"
            compat_packages: ""
          - homeassistant: "2026.10.0"
            python: "3.14"
            compat_packages: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pip install "homeassistant==${{ matrix.homeassistant }}"
          if [ -n "${{ matrix.compat_packages }}" ]; then
            python -m pip install "${{ matrix.compat_packages }}"
          fi

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: hassfest
        uses: home-assistant/actions/hassfest@master
